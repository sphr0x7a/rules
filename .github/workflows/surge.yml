name: Surge Rules Generator

on:
  push:
    branches:
      - surge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: surge

      - name: Generate IP lists
        run: |
          python3 <<'PY'
          import ipaddress
          from pathlib import Path

          root = Path(".")

          # 记录本次应该存在的生成文件
          expected_files = set()

          # 查找所有文件名包含 -ip 的 txt 文件
          for source in root.rglob("*"):
              if not source.is_file():
                  continue

              if ".git" in source.parts:
                  continue

              if "-ip" not in source.name:
                  continue

              if source.suffix.lower() != ".txt":
                  continue

              # 生成对应的 list 文件
              target = source.with_suffix(".list")
              expected_files.add(target)

              output_lines = []

              # 读取原始文件
              with source.open("r", encoding="utf-8-sig") as f:
                  for line in f:
                      original = line.rstrip("\r\n")
                      value = original.strip()

                      # 保留空行和注释
                      if not value or value.startswith("#"):
                          output_lines.append(original)
                          continue

                      # 判断 IP 类型
                      try:
                          network = ipaddress.ip_network(
                              value,
                              strict=False
                          )

                          if network.version == 4:
                              prefix = "IP-CIDR,"
                          else:
                              prefix = "IP-CIDR6,"

                          output_lines.append(
                              prefix + value + ",no-resolve"
                          )

                      except ValueError:
                          # 非 IP 内容保持原样
                          output_lines.append(original)

              # 写入生成文件
              target.write_text(
                  "\n".join(output_lines) + "\n",
                  encoding="utf-8"
              )

              print(f"Generated: {target}")

          # 清理已经失去对应源文件的生成文件
          for target in root.rglob("*"):
              if not target.is_file():
                  continue

              if ".git" in target.parts:
                  continue

              if "-ip" not in target.name:
                  continue

              if target.suffix.lower() != ".list":
                  continue

              if target not in expected_files:
                  target.unlink()
                  print(f"Deleted: {target}")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore: update Surge IP lists"
            git push origin surge
          else
            echo "No changes to commit."
          fi
